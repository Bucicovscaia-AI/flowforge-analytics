# Render Blueprint: one free web service that builds the Dockerfile and serves
# the FlowForge Analytics frontend and API together.
# Note: the free plan has no persistent disk, so uploaded datasets and reports
# are lost when the service restarts or redeploys.
services:
  - type: web
    name: flowforge-analytics
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: AI_API_KEY
        sync: false
      - key: MAKE_WEBHOOK_URL
        sync: false
