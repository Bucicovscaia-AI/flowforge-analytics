name: Keep the demo awake

# Render's free plan puts the service to sleep after 15 minutes without visits, and waking it
# takes up to a minute (and wipes uploads). A light request every 10 minutes keeps it running.
# GitHub may delay scheduled runs, and pauses them after 60 days without commits to the repo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -sS --fail --retry 3 --retry-delay 20 --max-time 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://flowforge-analytics.onrender.com/api/health
